services:
  nginx:
    image: nginx:1.28-alpine3.23
    container_name: ingress-nginx
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - togetgo_public
      - mtg

  mtg:
    image: nineseconds/mtg:2
    container_name: ingress-mtg
    restart: unless-stopped
    volumes:
      - ./secrets/mtg.toml:/config.toml:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - mtg

  certbot:
    image: certbot/certbot:v5.6.0
    network_mode: bridge
    profiles:
      - certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./letsencrypt:/etc/letsencrypt
      - ./state:/var/lib/ingress
    security_opt:
      - no-new-privileges:true

networks:
  togetgo_public:
    name: togetgo-public
    external: true
  mtg:
    name: ingress-mtg
