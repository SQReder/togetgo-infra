server {
    listen 8080 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 204;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    location / {
        return 404;
    }
}

server {
    listen 8080;
    server_name web.togetgo.app admin.togetgo.app s3.togetgo.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
