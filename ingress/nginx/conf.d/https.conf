server {
    listen 8444 ssl proxy_protocol default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/web.togetgo.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.togetgo.app/privkey.pem;

    return 404;
}

server {
    listen 8444 ssl proxy_protocol;
    server_name web.togetgo.app;

    ssl_certificate /etc/letsencrypt/live/web.togetgo.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.togetgo.app/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        set $web_upstream http://togetgo-web:3000;
        proxy_pass $web_upstream;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

server {
    listen 8444 ssl proxy_protocol;
    server_name admin.togetgo.app;

    ssl_certificate /etc/letsencrypt/live/admin.togetgo.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.togetgo.app/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        set $admin_upstream http://togetgo-admin:80;
        proxy_pass $admin_upstream;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}

server {
    listen 8444 ssl proxy_protocol;
    server_name s3.togetgo.app;

    ssl_certificate /etc/letsencrypt/live/s3.togetgo.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.togetgo.app/privkey.pem;

    client_max_body_size 6m;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, PUT, OPTIONS' always;
            add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
            add_header Access-Control-Max-Age 3000 always;
            add_header Vary Origin always;
            add_header Content-Length 0;
            return 204;
        }

        set $s3_upstream http://togetgo-minio:9000;
        proxy_pass $s3_upstream;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, PUT' always;
        add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
        add_header Access-Control-Expose-Headers ETag always;
        add_header Vary Origin always;
    }
}
