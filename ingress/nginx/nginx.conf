user nginx root;
worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

# 443 разделяется по SNI до терминации TLS: FakeTLS-домен mtg уходит в
# MTProto-прокси как чистый TCP, остальное — в локальный http-блок (8444).
# Оба апстрима получают PROXY protocol, чтобы сохранить клиентский IP.
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format stream '$remote_addr [$time_local] sni="$ssl_preread_server_name" '
                      'upstream=$stream_backend bytes_in=$bytes_received bytes_out=$bytes_sent';
    access_log /dev/stdout stream;

    map $ssl_preread_server_name $stream_backend {
        storage.googleapis.com ingress-mtg:3128;
        default 127.0.0.1:8444;
    }

    server {
        listen 8443;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $stream_backend;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $host [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" request_time=$request_time';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_origin $cors_origin {
        default '';
        'https://web.togetgo.app' $http_origin;
        'https://admin.togetgo.app' $http_origin;
    }

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
